<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="结合方言资料与明确标注的 AI 推测。">
  <meta name="referrer" content="no-referrer">
  <title>最尾厝问问</title>
  <link rel="icon" type="image/jpeg" href="../assets/logo.jpg">
  <link rel="stylesheet" href="./style.css?v=5">
  <script type="module" src="./app.js?v=5"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./youxi_index.html"><span class="seal" aria-hidden="true">尤</span><span>尤溪县方言<span class="brand-sub">问答</span></span></a>
    <div class="top-actions"><a class="home-link" href="../">返回最尾厝 ↗</a><button id="settings-open" class="outline" type="button">连接模型 <span id="connection-dot" class="dot"></span></button></div>
  </header>
  <main class="layout">
    <section class="conversation" aria-label="方言问答">
      <div id="welcome" class="welcome">
        <h1><span>最尾厝</span>问问</h1>
        <p class="intro">关于尤溪县方言<br>资料原文与 AI 推测，分开回答</p>
        <div class="suggestions" aria-label="试问一个问题">
          <button type="button" data-question="尤溪县城关话有几个声调？各自的调值是什么？"><span>01</span>城关话有几个声调？<span aria-hidden="true">↗</span></button>
          <button type="button" data-question="尤溪县城关话有几个声母、韵母？"><span>02</span>城关话有几个声母、韵母？<span aria-hidden="true">↗</span></button>
          <button type="button" data-question="尤溪城关话与普通话的声调有什么区别？请自主比较。"><span>03</span>与普通话有什么区别？<span aria-hidden="true">↗</span></button>
        </div>
      </div>
      <div id="messages" class="messages" role="log" aria-label="对话记录"></div>
      <div class="composer-wrap">
        <p id="status" class="status" role="status">正在载入方言资料…</p>
        <form id="question-form" class="composer">
          <label class="sr-only" for="question">你想了解的尤溪方言问题</label>
          <textarea id="question" rows="2" maxlength="1200" placeholder="输入关于尤溪县方言的问题..." required></textarea>
          <button id="send" class="send" type="submit" disabled aria-label="发送问题">↑</button>
          <button id="stop" class="outline hidden" type="button">停止</button>
        </form>
        <p class="composer-note">资料原文 · AI 推测 <span>Enter 发送，Shift + Enter 换行</span></p>
      </div>
    </section>
  </main>
  <dialog id="settings" aria-labelledby="settings-title">
    <form id="settings-form">
      <div class="dialog-heading"><h2 id="settings-title">连接回答模型</h2><button id="settings-close" type="button" class="icon-button" aria-label="关闭">×</button></div>
      <fieldset class="connection-choice">
        <legend>选择连接方式</legend>
        <label><input type="radio" name="connection-mode" value="shared" checked>最尾厝密钥</label>
        <label><input type="radio" name="connection-mode" value="personal">使用自己的 API 密钥</label>
      </fieldset>
      <div id="shared-fields">
        <label for="access-password">最尾厝密钥</label>
        <input id="access-password" type="password" placeholder="输入提供给你的访问密码" autocomplete="off" spellcheck="false" maxlength="128" required>
        <p class="privacy-note">使用最尾厝提供的模型额度。</p>
      </div>
      <div id="personal-fields" class="hidden">
        <label for="api-key">DeepSeek API 密钥</label>
        <input id="api-key" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false" disabled>
        <label for="model">模型名称</label>
        <input id="model" value="deepseek-flash" autocomplete="off" spellcheck="false" maxlength="100" disabled>
        <p class="privacy-note">使用你自己的 DeepSeek 账户额度。</p>
      </div>
      <label for="search-key">Tavily 联网搜索密钥（可选）</label>
      <input id="search-key" type="password" placeholder="tvly-…" autocomplete="off" spellcheck="false">
      <p class="privacy-note">两种连接方式均可搭配自己的搜索密钥；填写后按需搜索，未填写则不联网搜索。</p>
      <p id="login-status" role="status"></p>
      <p class="privacy-note">密码与密钥仅保存在当前页面内存中，刷新即清除。最尾厝模式经问答服务调用模型；自带模型密钥直接连接 DeepSeek。开启搜索时，搜索词发送给 Tavily。</p>
      <div class="dialog-actions"><button id="disconnect" type="button" class="outline">清除连接</button><button id="connect-submit" type="submit" class="primary">连接并继续</button></div>
    </form>
  </dialog>
</body>
</html>
