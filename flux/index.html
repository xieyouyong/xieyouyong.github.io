<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="查询通量站点资料与观测时间序列。">
  <title>通量站点问答</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./public-data.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../" title="返回个人主页"><span class="seal" aria-hidden="true">通</span><span>FLUX<span class="brand-sub">站点问答</span></span></a>
    <div class="top-actions">
      <button id="new-chat" class="outline" type="button" hidden>新对话</button>
      <button id="settings-open" class="outline" type="button" hidden>回答设置 <span class="dot" aria-hidden="true"></span></button>
    </div>
  </header>
  <main class="layout">
    <section class="conversation" aria-label="通量站点问答">
      <div id="welcome" class="welcome">
        <h1><span>通量站点</span>问答</h1>
        <p class="intro">查询全球通量站点资料与中国站点的观测数据。<br>用对话查来源、看时序，也可以直接绘图。</p>
        <div class="suggestions" aria-label="示例问题">
          <button type="button" disabled>CN-HaM 有哪些数据来源？<span aria-hidden="true">↗</span></button>
          <button type="button" disabled>同图绘制 CN-HaM、CN-Du2 2014 年 7 月逐小时气温<span aria-hidden="true">↗</span></button>
          <button type="button" disabled>用红色散点绘制中国站点的空间分布<span aria-hidden="true">↗</span></button>
        </div>
      </div>
      <div id="messages" class="messages" role="log" aria-label="对话记录"></div>
      <div class="composer-wrap">
        <p id="status" class="status" role="status">正在读取站点目录…</p>
        <p id="launch-help" class="launch-help" hidden>资料加载失败。请刷新页面重试。</p>
        <noscript><p class="launch-help">请开启浏览器的 JavaScript。</p></noscript>
        <form id="ask" class="composer">
          <label class="sr-only" for="question">输入问题</label>
          <textarea id="question" rows="2" maxlength="700" placeholder="输入站点、变量或你想查看的时间范围…" required disabled></textarea>
          <button type="submit" class="send" aria-label="发送问题" disabled>↑</button>
          <button id="stop-answer" type="button" class="outline" hidden>停止</button>
        </form>
        <p class="composer-note"><span>站点资料 · 质控逐小时</span><span>Enter 发送，Shift + Enter 换行</span></p>
      </div>
    </section>
  </main>
  <dialog id="settings" aria-labelledby="settings-title">
    <form id="model-form">
      <div class="dialog-heading"><h2 id="settings-title">连接 DeepSeek</h2><button id="settings-close" class="icon-button" type="button" aria-label="关闭">×</button></div>
      <p id="model-status" role="status"></p>
      <label for="api-key">DeepSeek API 密钥</label>
      <input id="api-key" type="password" autocomplete="off" placeholder="填写你的 sk-… 密钥">
      <label class="model-name-label" for="model-name">模型名称</label>
      <input id="model-name" type="text" value="deepseek-flash" maxlength="80" required>
      <p>连接时会发送一次简短的测试请求。连接后，DeepSeek 会理解提问并根据查询结果回答。测试和回答会消耗 Token。</p>
      <p>密钥仅保存在当前页面内存中，由浏览器发送给 DeepSeek。</p>
      <div class="dialog-actions"><button id="model-disconnect" class="outline" type="button">清除连接</button><button id="model-connect" class="outline" type="submit">连接并继续</button></div>
    </form>
  </dialog>
  <dialog id="delete-message-dialog" aria-labelledby="delete-message-title">
    <form method="dialog">
      <h2 id="delete-message-title">确认删除</h2>
      <p id="delete-message-description"></p>
      <label><input type="checkbox" id="skip-delete-confirmation"> 本次对话不再确认</label>
      <div class="dialog-actions">
        <button class="outline" value="cancel" autofocus>取消</button>
        <button class="outline" value="delete">确认删除</button>
      </div>
    </form>
  </dialog>
</body>
</html>
