<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:url" content="https://xieyouyong.github.io/" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="谢有涌 · 南京大学大气科学" />
    <meta name="twitter:description" content="谢有涌的个人主页，大气科学硕博连读，中尺度灾害性天气模拟。" />

    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        /* ===== 主容器（毛玻璃效果） ===== */
        .container {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 48px 44px 40px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: scale(1.005);
        }

        /* ===== 顶部标题（华丽升级版） ===== */
        .site-header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px dashed rgba(118, 75, 162, 0.2);
            padding-bottom: 24px;
            position: relative;
        }

        /* 装饰光晕 */
        .site-header::before {
            content: '';
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(118, 75, 162, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .main-title {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(118, 75, 162, 0.2);
            position: relative;
            z-index: 1;
            display: inline-block;
            padding: 0 20px;
            animation: shimmer 3s ease-in-out infinite alternate;
        }

        /* 炫彩流动动画 */
        @keyframes shimmer {
            0% {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
                -webkit-background-clip: text;
                background-clip: text;
            }
            50% {
                background: linear-gradient(135deg, #f093fb 0%, #667eea 50%, #764ba2 100%);
                -webkit-background-clip: text;
                background-clip: text;
            }
            100% {
                background: linear-gradient(135deg, #764ba2 0%, #f093fb 50%, #667eea 100%);
                -webkit-background-clip: text;
                background-clip: text;
            }
        }

        /* 标题下方的装饰性小字 */
        .sub-title {
            font-size: 18px;
            color: #7c5c8a;
            margin-top: 8px;
            letter-spacing: 6px;
            font-weight: 300;
            position: relative;
            z-index: 1;
            opacity: 0.8;
        }

        .sub-title span {
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* 装饰小点 */
        .title-decoration {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 6px;
            font-size: 20px;
            opacity: 0.5;
        }

        /* ===== 三块卡片网格 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 28px;
            margin-bottom: 20px;
        }

        .card-block {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 28px 22px 32px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .card-block:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.8);
        }

        .card-block .icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .card-block h2 {
            font-size: 24px;
            font-weight: 700;
            color: #0f2c3d;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        .card-block p {
            color: #475569;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 20px;
            flex: 1;
        }

        /* ===== 卡片内的按钮 ===== */
        .btn {
            display: inline-block;
            padding: 10px 24px;
            background: #764ba2;
            color: #fff;
            border: none;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            transition: 0.3s ease;
            box-shadow: 0 4px 14px rgba(118, 75, 162, 0.25);
            align-self: flex-start;
            margin-top: auto;
        }

        .btn:hover {
            background: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .card-block:nth-child(2) .btn {
            background: #0ea5e9;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.3);
        }
        .card-block:nth-child(2) .btn:hover {
            background: #0284c7;
        }

        .card-block:nth-child(3) .btn {
            background: #f59e0b;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
        }
        .card-block:nth-child(3) .btn:hover {
            background: #d97706;
        }

        /* ===== 页脚 ===== */
        .footer {
            margin-top: 36px;
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
            border-top: 1px solid rgba(148, 163, 184, 0.2);
            padding-top: 22px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .container {
                padding: 24px 16px 28px;
            }
            .main-title {
                font-size: 32px;
                letter-spacing: 1px;
            }
            .sub-title {
                font-size: 14px;
                letter-spacing: 4px;
            }
            .grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .card-block {
                padding: 22px 18px 26px;
            }
            .title-decoration {
                font-size: 16px;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="site-header">

            <div class="sub-title">

            <!-- 底部装饰点 -->
            <div class="title-decoration">

                <span>✧</span>
                <span>✦</span>
                <span>✧</span>
                <span>✦</span>

        <!-- 三大功能块 -->
        <div class="grid">
            <!-- 块1：个人简介 -->
            <div class="card-block">

                <h2>个人简介</h2>
                <p>关于我，我的经历、兴趣与正在做的事。这里将展示一个真实的我。</p>

            <!-- 块3：其他工具箱（包含 24 点） -->
            <div class="card-block">

                <p>一些有趣实用的小工具。比如 24 点计算器，挑战你的算术头脑！</p>
                <a href="tool/24point.html" class="btn">🧮 24点计算</a>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            © 2026 我的小站
        </div>
    </div>

</body>
</html>
