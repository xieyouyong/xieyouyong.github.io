<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人网站</title>
    <style>
        /* 这里是 CSS 样式，负责让网页变好看 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            /* 背景渐变色，从蓝色到紫色 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 60px 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            width: 100%;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: scale(1.02);
        }
        h1 {
            font-size: 48px;
            color: #333;
            margin-bottom: 10px;
        }
        h1 span {
            color: #764ba2;
        }
        p {
            font-size: 18px;
            color: #555;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 40px;
            background: #764ba2;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }
        .btn:hover {
            background: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }
        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>你好, <span>世界</span> 👋</h1>
        <p>
            这是我的第一个个人网站。<br>
            我正在学习如何建设一个漂亮的页面！
        </p>
        <div class="btn-group">
            <a href="#" class="btn">了解更多</a>
            <a href="24point.html" class="btn">🧮 24点计算</a>
        </div>
        <div class="footer">
            © 2026 我的小站
        </div>
    </div>
</body>
</html>
